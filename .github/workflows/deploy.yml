# Builds the site and uploads it to Hostinger every time you push to main.
# One-time setup (GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret):
#   FTP_SERVER    e.g. ftp.seanredenbaugh.com   (Hostinger hPanel -> Files -> FTP Accounts)
#   FTP_USERNAME  e.g. u123456789.seanredenbaugh.com
#   FTP_PASSWORD  your FTP password
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Reuse resized images from earlier builds
        uses: actions/cache@v4
        with:
          path: .thumbcache
          key: thumbs-${{ hashFiles('static/wp-content/**') }}
          restore-keys: thumbs-

      - run: python build.py

      - name: Upload to Hostinger
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq lftp > /dev/null
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<'LFTP'
          set ftp:ssl-allow true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:timeout 60
          set net:max-retries 4
          set net:reconnect-interval-base 5
          set cmd:fail-exit true
          # 1) Make the server match dist/ exactly: upload new or resized files, delete removed ones.
          mirror --reverse --delete --ignore-time --parallel=6 --verbose=1 dist/ ./
          # 2) Always re-send pages, styles and scripts, since an edit can keep a file the same size.
          mirror --reverse --parallel=6 --verbose=1 --include-glob=*.html --include-glob=*.css --include-glob=*.js --include-glob=*.xml --include-glob=*.php --include-glob=.htaccess --include-glob=*.txt --include-glob=*.svg dist/ ./
          bye
          LFTP

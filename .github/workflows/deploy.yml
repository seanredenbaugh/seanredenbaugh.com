# Builds the site and uploads it to Hostinger every time you push to main.
# One-time setup (GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret):
#   FTP_SERVER    e.g. ftp.seanredenbaugh.com   (Hostinger hPanel -> Files -> FTP Accounts)
#   FTP_USERNAME  e.g. u123456789.seanredenbaugh.com
#   FTP_PASSWORD  your FTP password
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Reuse resized images from earlier builds
        uses: actions/cache@v4
        with:
          path: .thumbcache
          key: thumbs-${{ hashFiles('static/wp-content/**') }}
          restore-keys: thumbs-

      - run: python build.py

      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: dist/
          server-dir: ./

---
title: Rivers Of Bold
date: '2001-08-26'
type: poem
---
<p>If levees of fear so strong<br/> Hold back the rivers of bold<br/> May sadness be your song<br/> And sweetness what you sold</p> <p>For past the walls of pain<br/> You’ll hear a peaceful sound<br/> In the waters of your gain<br/> Serenity is found</p>

---
title: Omnipotence
date: '2002-02-27'
type: poem
---
<p>To find the greatness of a man<br/> Look in the eyes of those suppressed<br/> For power isn’t taken<br/> But given by the ones impressed</p> <p>And taken back with equal haste<br/> As if it never real<br/> For people rise above a man<br/> As often as they kneel</p>

---
title: Divulgence
date: '2002-06-30'
type: poem
---
<p>The ebb and flow of mental tide<br/> And waters that subdue<br/> Have veiled the face I wear inside<br/> And torn my heart in two</p> <p>For secrets don ornate disguise<br/> When in the public view<br/> Yet bare themselves in naked eyes<br/> Where stories are but true</p>

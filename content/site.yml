# Site-wide settings for seanredenbaugh.com
# Edit the text after the colons. Keep the indentation (spaces) the way it is.
# Text containing a colon or starting with a quote mark should be wrapped in "double quotes".

name: Sean Redenbaugh

# The sentence under your name at the top of the home page (<em>…</em> makes a book title italic)
tagline: "Author of <em>Sunlight Parted</em>, <em>Salima Falls</em> and <em>1000 Shades of Red</em>."

# The italic lines in the footer of every page (use | and a new line for each line)
footer_line: |
  Life’s journey is too vast for me alone,
  in but a thousand lifetimes to perceive.

# Shown on the Contact page and in the footer
email: seanredenbaugh@yahoo.com

# What Google shows under the site's name in search results
description: Sean Redenbaugh is an author and poet — the memoir 1000 Shades of Red and the novels Salima Falls and Sunlight Parted — and a nature photographer.

# The top menu. Each item has a label and a link.
# Add "children" to make a dropdown (the parent link is used on phones and when clicked).
menu:
  - label: Books
    link: /my-books/
  - label: Writing
    link: /other-poetry/
    children:
      - label: Poetry
        link: /other-poetry/
      - label: Sonnets
        link: /sonnets/
      - label: Scripts
        link: /scripts/
  - label: Photography
    link: /photography/
  - label: About
    link: /about/
  - label: Contact
    link: /contact/

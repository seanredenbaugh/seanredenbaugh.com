- title: Vital Statistics
  html: '<table> <tbody> <tr> <td>Nickname</td> <td>Maverick</td> </tr> <tr> <td>Height / Weight</td> <td>5’8″ / 180 lbs</td> </tr> <tr> <td>Born &amp; Raised</td> <td>Midwestern Indiana</td> </tr> <tr> <td>Current Home</td> <td>Evansville, IN</td> </tr> <tr> <td>Relationship Status</td> <td>Married (happily)</td> </tr> <tr> <td>Rooting Interests</td> <td>IU, 49ers, Steph Curry</td> </tr> <tr> <td>Pets</td> <td>Arlo (white dachshund)<br>Ace (jack weenie)<br>Spades (dachshund, 2009–2024)</td> </tr> <tr> <td>Blood Type</td> <td>Type O+</td> </tr> </tbody> </table>


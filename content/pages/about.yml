- title: Professional Life
  html: '<p>I graduated from Indiana University in 2002 with a Business degree in Computer Information Systems. IU helped to instill me with an entrepreneurial spirit, and I have started, helped start, or ran several business in my life, including a programming consultant business, a wedding photography business, and a digital advertising firm. I currently have a successful real estate rental business: Maverick Real Estate Investments (<a href="https://www.mavrei.com">www.mavrei.com</a>).</p>

    <p>As for full time employment, I have been a Systems Administrator for about 20 years, currently with Hoosier Wheel / OTR Wheel (<a href="https://www.otrwheel.com">otrwheel.com</a>).</p>

    '
- title: Personal Life
  html: '<p>I grew up in a small town on the border of Indiana and Illinois with roughly 200 people in it. I spent my summers and weekends riding my bike, or at the park playing pick-up basketball and football with the other town boys. I played 7 sports in high school and graduated 3rd in my class. Then I went to IU and spent the most amazing 4 years of my life there. It helped shape me into the person I have become, and I miss it often. I visit as often as I can. After college, I moved to Evansville to pursue other things, and I have been there ever since. I got married on 6/14/14 to my beautiful and Loving bride Amanda, and we spend our time reading, working on projects, playing with our adorable puppies, working out, or playing board games with our friends (you know who you are). My hobbies include golf, biking, writing, cards &amp; games, poker, music, movies, fantasy football, watching sports, playing pickleball, running, 3D Printing, etc…</p>

    '
- title: Goals
  html: '<p>One of my major goals is to write a very successful novel, or series of novels. This of course means getting published by a legitimate publishing house. I am currently working hard on that goal. Another goal of mine is to travel a lot more. I have a huge bucket list of places I would like to see, and have yet to make a dent in it. Now that I’m married, I hope the two of us find time to see a lot of the amazing things this world has to offer. Professionally, I plan on having 20+ rental properties by the time I’m 50, and possibly be able to work only part-time soon after that, and spend the extra time flipping houses.</p>

    '

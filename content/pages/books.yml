  synopsis:
  - 1000 Shades of Red is the first-person, emotional, and existential journey of a new freshman starting college at Indiana University. It follows him through four years exploring campus, self-discovery, poetic expression, absorption in music, friendships, shenanigans, temptation, and the intense moments of a young man experiencing love gained and love lost for the first time. All of this is set in the beautiful and magical nearly 2000-acre campus of Indiana University in Bloomington.
  excerpt:
  - Up ahead is Ballantine Hall. It was once the tallest academic building in the country, and still is the tallest building here on campus. Everyone has a class here at some point. It has eleven stories, a six foot metal globe in the atrium, and a notorious history of suicides throughout the years. Yes, I said suicides. Panicked students who couldn’t bear a looming failure. Worried teens stressed about an upcoming exam. Heartbroken young adults feeling love lost for the first time. Causes not nearly monumental enough for the deed and its inevitable effect. That’s where my class is today. Suicide Hall.
  - I look up at the top as I approach, to the ledge perched high above the trees overlooking the concrete steps and bicycle racks below. I imagine being one of those kids at the end of his or her wits, standing there looking down at the parking curb that’s about to go through their head at thirty miles an hour. All because of a piece of paper with questions typed on it, handed to them by a total stranger. Or because someone didn’t want to be with them anymore. Or who knows why. I honestly can’t comprehend it. I try to wrap my brain around the idea and make sense of it. What were they thinking? What were they feeling? How could they possibly justify jumping? Did they regret it during the two or three seconds they were suspended in the air before their bodies crashed messily in front of people? Did they spend that time thinking about their grades? About the test? About a girl? Or about the infinity they are leaping into? What was that final moment like? When their atoms became part of the
    earth and no longer a part of themselves. When the spaces between dissipated. Dreams and hopes exploded on impact. Books and music scattered on the pavement. Love and romance liquified. Sex and pain and memories drying in the sun. The past, present, and future in a thousand shades of red painting the sidewalk. Oozing from a former something. A current nothing. A memory. Surrounded by the screams of others. Maybe that should be our house mural. That would surely make people think. But their demise makes no sense to me. A test or a class or a grade is a blip on the radar. A dot on an infinite line. A commercial break. A meaningless, forgettable thing. A speck on the vast mural of life! It pales next to friendship! It dissolves next to Love!
  - Thinking about it all makes me lose my appetite for my next class. Statistical Probabilities. Probably, pun intended, my least favorite class ever. But I can’t do it today. I can’t sit through another commercial right now. So I walk back down the steps of Ballantine Hall, across the grassy area, and sit at the base of a tree outside of Woodburn Hall across the way. No one has ever jumped off of this one. It’s not tall enough. It would only add pain to pain.

# Photography page. Photos appear in the order listed under "photos:".
# To remove a photo, delete its three lines (the "- src:" line plus its number and title).
# To add one, upload the image to static/wp-content/uploads/ and copy an entry.
portrait: /wp-content/uploads/2014/07/behindcamera.jpg
quotes:
- text: To me, photography is an art of observation. It’s about finding something interesting in an ordinary place… I’ve found it has little to do with the things you see and everything to do with the way you see them.
  by: Elliott Erwitt
- text: Beauty can be seen in all things, seeing and composing the beauty is what separates the snapshot from the photograph.
  by: Matt Hardy
